version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      artifact-actions:
        patterns:
          - 'actions/upload-artifact'
          - 'actions/download-artifact'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # What @emberx/vendor is written from (scripts/build-emberx-vendor.ts): a bump needs
      # `npm run vendor`, which CI's vendor check enforces, so these move on
      # their own and never auto-merge.
      vendored:
        patterns:
          - 'ember-source'
          - '@glimmer/component'
          - 'location-bar'
      dev-tooling:
        patterns:
          - 'esbuild'
          - 'typescript'
          - 'prettier'
          - 'git-cliff'
      testing:
        patterns:
          - 'qunitx'
          - 'qunitx-cli'
          - 'qunit-dom'
          - '@memoria/*'
