version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      artifact-actions:
        patterns:
          - 'actions/upload-artifact'
          - 'actions/download-artifact'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # ember-source carries the renderer and the autotracking registry, so a
      # second copy means silently broken reactivity. It moves on its own, and
      # never auto-merges.
      ember:
        patterns:
          - 'ember-source'
      dev-tooling:
        patterns:
          - 'esbuild'
          - 'typescript'
          - 'prettier'
          - 'git-cliff'
      testing:
        patterns:
          - 'qunitx'
          - 'qunitx-cli'
          - 'qunit-dom'
          - '@memserver/*'
