name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; let every main-branch run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same-repo PRs fire both `push` and `pull_request` for one SHA. The inlined
# `if:` on lint/test/bench skips the pull_request leg, since push already covers
# it. Forks still run, because pushes from forks do not trigger this workflow.
jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # Deno is not an npm dependency; this is the version `npm run lint` uses in
      # CI, and the test, browser-compat, bench and package jobs pin the same one,
      # as does the Dockerfile. Bump them together.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      # The docs' code examples, run and checked by `deno test --doc`.
      - run: npm run test:doctests
      - run: npm run typecheck

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 15 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      # Same pinned Deno as the lint job, for the Deno suite.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - run: npm ci
      # On macOS qunitx-cli ignores CHROME_BIN and drives playwright's
      # chromium-headless-shell, which npm ci does not download. qunitx-cli's own
      # CI installs it the same way.
      - run: node_modules/.bin/playwright-core install chromium-headless-shell
        if: runner.os == 'macOS'
      # No build: every suite runs from the sources, which each package's
      # exports point at. One that needed dist/ again would fail here.
      # The node suite proves the packages resolve and run under plain node,
      # which is emberx's central claim. The browser suite is where the renderer,
      # the router and every DOM assertion actually run.
      - run: npm run test:node
        env:
          FORCE_COLOR: 0
      # The same suite under Deno, through qunitx's Deno build.
      - run: npm run test:deno
        env:
          NO_COLOR: 1
      - run: npm run test:browser
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          FORCE_COLOR: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: tmp/junit.xml
          retention-days: 3
          if-no-files-found: ignore

  # Line and branch coverage of the packages' sources, from the Deno suite (which
  # is the browser suite plus @emberx/ssr), sent to Codecov for the README's badge
  # and the PR comment. The Pages workflow publishes the same report.
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - run: npm ci
      - run: npm run test:coverage
        env:
          NO_COLOR: 1
      - uses: codecov/codecov-action@v7
        with:
          files: tmp/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tmp/coverage/html/
          retention-days: 3

  # Firefox and WebKit are slower and less load-bearing than chromium, so they
  # run as their own job rather than widening the matrix above.
  browser-compat:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: browser-compat (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # The build runs with Deno (build.ts). Same pinned Deno as the lint job.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - run: npm ci
      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright@${{ steps.pw-version.outputs.version }} install --with-deps ${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright@${{ steps.pw-version.outputs.version }} install-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          QUNITX_BROWSER: ${{ matrix.browser }}
          FORCE_COLOR: 0

  # Measures what emberx sells: runtime template compilation, the work other
  # frameworks do at build time and emberx does on page load.
  #
  # `bench:compare` (scripts/check-benchmarks.ts --base) measures the base commit
  # and this one back to back on this runner, so the comparison is like for
  # like; nothing is committed. The base is the PR's base, or where a pushed
  # branch left main. A gate: of its runs through October 2026, it failed only
  # where a change was slower on purpose, which a Benchmark-Regression trailer
  # accepts (CONTRIBUTING.md).
  bench:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is checked out into a worktree and measured too.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      # For the Chrome.bench files (benches/*.chrome.bench.ts).
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - run: npm ci
      - run: npm run bench:compare -- ${{ github.event.pull_request.base.sha }}
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NO_COLOR: 1

  # Tests the packaged artefacts, not the checkout: scripts/test-release.sh packs
  # each workspace, installs the tarballs into a throwaway consumer, and runs a
  # consumer smoke test plus the node suite against them. Catches
  # `files`/`exports`/missing-dependency mistakes that source tests cannot see.
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # test:release runs the suite under Deno as well, against the tarballs.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - run: npm ci
      - run: npm run test:release
        env:
          FORCE_COLOR: 0

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # `make release` already wrote the CHANGELOG section and published to npm;
      # this only mirrors that section onto the GitHub release. `--latest` is the
      # section for the tag this run was triggered by — `--unreleased` would be
      # empty here, since the tag already exists.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run changelog:latest > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
